upload_max_filesize = 25M
post_max_size = 30M
memory_limit = 512M
max_execution_time = 120

; Opcache is on in this image by default, but sized for a small app (2026-11-10 audit §5): app/ and vendor/ are about
; 9,000 PHP files against a default table of 10,000, and a full table silently stops caching new files.
; Timestamps stay checked, so an edit to the bind-mounted code is picked up within two seconds.
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
; On a production image, where the code does not change under the process, also set:
;   opcache.validate_timestamps = 0
; and run `php artisan config:cache && php artisan route:cache` at deploy.
