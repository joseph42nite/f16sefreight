    <div id="cap-0" class="clip cap" data-start="0.2" data-duration="0.7" data-track-index="0"><span>You're importing a</span></div>
    <div id="cap-1" class="clip cap" data-start="0.9" data-duration="1.56" data-track-index="0"><span>container of furniture:</span></div>
    <div id="cap-2" class="clip cap" data-start="2.46" data-duration="1.28" data-track-index="0"><span>one big steel box</span></div>
    <div id="cap-3" class="clip cap" data-start="3.74" data-duration="0.91" data-track-index="0"><span>on a ship.</span></div>
    <div id="cap-4" class="clip cap" data-start="4.65" data-duration="0.9" data-track-index="0"><span>It reaches the port</span></div>
    <div id="cap-5" class="clip cap" data-start="5.55" data-duration="1.64" data-track-index="0"><span>in Mumbai on time.</span></div>
    <div id="cap-6" class="clip cap" data-start="7.19" data-duration="0.55" data-track-index="0"><span>Then it sits</span></div>
    <div id="cap-7" class="clip cap" data-start="7.74" data-duration="1.22" data-track-index="0"><span>there for 10 days,</span></div>
    <div id="cap-8" class="clip cap" data-start="8.96" data-duration="1.51" data-track-index="0"><span>waiting for paperwork.</span></div>
    <div id="cap-9" class="clip cap" data-start="10.47" data-duration="1.51" data-track-index="0"><span>And a bill arrives.</span></div>
    <div id="cap-10" class="clip cap" data-start="11.98" data-duration="1.41" data-track-index="0"><span>About $1,000,</span></div>
    <div id="cap-11" class="clip cap" data-start="13.39" data-duration="1.65" data-track-index="0"><span>almost ₹1 lakh,</span></div>
    <div id="cap-12" class="clip cap" data-start="15.04" data-duration="0.55" data-track-index="0"><span>for a box</span></div>
    <div id="cap-13" class="clip cap" data-start="15.59" data-duration="1.47" data-track-index="0"><span>that never moved.</span></div>
    <div id="cap-14" class="clip cap" data-start="17.06" data-duration="1.55" data-track-index="0"><span>Why pay for standing still?</span></div>
    <div id="cap-15" class="clip cap" data-start="18.61" data-duration="1.36" data-track-index="0"><span>Let me explain.</span></div>
    <div id="cap-16" class="clip cap" data-start="19.97" data-duration="0.43" data-track-index="0"><span>First,</span></div>
    <div id="cap-17" class="clip cap" data-start="20.4" data-duration="1.65" data-track-index="0"><span>that box isn't yours.</span></div>
    <div id="cap-18" class="clip cap" data-start="22.05" data-duration="0.74" data-track-index="0"><span>It belongs to</span></div>
    <div id="cap-19" class="clip cap" data-start="22.79" data-duration="0.88" data-track-index="0"><span>the shipping line,</span></div>
    <div id="cap-20" class="clip cap" data-start="23.67" data-duration="0.75" data-track-index="0"><span>the company that</span></div>
    <div id="cap-21" class="clip cap" data-start="24.42" data-duration="1.2" data-track-index="0"><span>runs the ship.</span></div>
    <div id="cap-22" class="clip cap" data-start="25.62" data-duration="1.62" data-track-index="0"><span>You're only borrowing it.</span></div>
    <div id="cap-23" class="clip cap" data-start="27.24" data-duration="0.78" data-track-index="0"><span>They lend it free</span></div>
    <div id="cap-24" class="clip cap" data-start="28.02" data-duration="0.62" data-track-index="0"><span>for a few days</span></div>
    <div id="cap-25" class="clip cap" data-start="28.64" data-duration="1.31" data-track-index="0"><span>after it lands.</span></div>
    <div id="cap-26" class="clip cap" data-start="29.95" data-duration="1.68" data-track-index="0"><span>This is called free time.</span></div>
    <div id="cap-27" class="clip cap" data-start="31.63" data-duration="2.1" data-track-index="0"><span>Often around 5 days.</span></div>
    <div id="cap-28" class="clip cap" data-start="33.73" data-duration="1.44" data-track-index="0"><span>Now the clock starts.</span></div>
    <div id="cap-29" class="clip cap" data-start="35.17" data-duration="1.1" data-track-index="0"><span>Every extra day the</span></div>
    <div id="cap-30" class="clip cap" data-start="36.27" data-duration="0.97" data-track-index="0"><span>full box waits in</span></div>
    <div id="cap-31" class="clip cap" data-start="37.24" data-duration="0.39" data-track-index="0"><span>the port,</span></div>
    <div id="cap-32" class="clip cap" data-start="37.63" data-duration="0.81" data-track-index="0"><span>you pay.</span></div>
    <div id="cap-33" class="clip cap" data-start="38.44" data-duration="1.8" data-track-index="0"><span>This is called demurrage.</span></div>
    <div id="cap-34" class="clip cap" data-start="40.24" data-duration="1.55" data-track-index="0"><span>For a 20-foot container,</span></div>
    <div id="cap-35" class="clip cap" data-start="41.79" data-duration="0.79" data-track-index="0"><span>that can be around</span></div>
    <div id="cap-36" class="clip cap" data-start="42.58" data-duration="1.75" data-track-index="0"><span>$100 a day.</span></div>
    <div id="cap-37" class="clip cap" data-start="44.33" data-duration="2.21" data-track-index="0"><span>About ₹9,000.</span></div>
    <div id="cap-38" class="clip cap" data-start="46.54" data-duration="1.07" data-track-index="0"><span>And it often rises</span></div>
    <div id="cap-39" class="clip cap" data-start="47.61" data-duration="1.65" data-track-index="0"><span>the longer it stays.</span></div>
    <div id="cap-40" class="clip cap" data-start="49.26" data-duration="1.34" data-track-index="0"><span>But here's the catch.</span></div>
    <div id="cap-41" class="clip cap" data-start="50.6" data-duration="0.58" data-track-index="0"><span>Getting it out</span></div>
    <div id="cap-42" class="clip cap" data-start="51.18" data-duration="0.46" data-track-index="0"><span>of the port</span></div>
    <div id="cap-43" class="clip cap" data-start="51.64" data-duration="1.27" data-track-index="0"><span>isn't the end.</span></div>
    <div id="cap-44" class="clip cap" data-start="52.91" data-duration="0.51" data-track-index="0"><span>You truck it to</span></div>
    <div id="cap-45" class="clip cap" data-start="53.42" data-duration="1.84" data-track-index="0"><span>your warehouse and unload.</span></div>
    <div id="cap-46" class="clip cap" data-start="55.26" data-duration="0.67" data-track-index="0"><span>Until the empty</span></div>
    <div id="cap-47" class="clip cap" data-start="55.93" data-duration="1.13" data-track-index="0"><span>box goes back,</span></div>
    <div id="cap-48" class="clip cap" data-start="57.06" data-duration="1.71" data-track-index="0"><span>a second clock runs.</span></div>
    <div id="cap-49" class="clip cap" data-start="58.77" data-duration="1.66" data-track-index="0"><span>This is called detention.</span></div>
    <div id="cap-50" class="clip cap" data-start="60.43" data-duration="0.86" data-track-index="0"><span>Same idea,</span></div>
    <div id="cap-51" class="clip cap" data-start="61.29" data-duration="1.23" data-track-index="0"><span>but outside the port:</span></div>
    <div id="cap-52" class="clip cap" data-start="62.52" data-duration="0.95" data-track-index="0"><span>you're keeping the shipping</span></div>
    <div id="cap-53" class="clip cap" data-start="63.47" data-duration="1.81" data-track-index="0"><span>line's box too long.</span></div>
    <div id="cap-54" class="clip cap" data-start="65.28" data-duration="0.18" data-track-index="0"><span>So,</span></div>
    <div id="cap-55" class="clip cap" data-start="65.46" data-duration="0.92" data-track-index="0"><span>the difference?</span></div>
    <div id="cap-56" class="clip cap" data-start="66.38" data-duration="0.7" data-track-index="0"><span>Demurrage:</span></div>
    <div id="cap-57" class="clip cap" data-start="67.08" data-duration="0.88" data-track-index="0"><span>the full box is</span></div>
    <div id="cap-58" class="clip cap" data-start="67.96" data-duration="1.55" data-track-index="0"><span>stuck inside the port.</span></div>
    <div id="cap-59" class="clip cap" data-start="69.51" data-duration="0.97" data-track-index="0"><span>Detention:</span></div>
    <div id="cap-60" class="clip cap" data-start="70.48" data-duration="0.93" data-track-index="0"><span>the box is out,</span></div>
    <div id="cap-61" class="clip cap" data-start="71.41" data-duration="1.58" data-track-index="0"><span>but not yet returned.</span></div>
    <div id="cap-62" class="clip cap" data-start="72.99" data-duration="1.24" data-track-index="0"><span>Why charge at all?</span></div>
    <div id="cap-63" class="clip cap" data-start="74.23" data-duration="0.85" data-track-index="0"><span>A box standing</span></div>
    <div id="cap-64" class="clip cap" data-start="75.08" data-duration="0.98" data-track-index="0"><span>still can't carry</span></div>
    <div id="cap-65" class="clip cap" data-start="76.06" data-duration="1.53" data-track-index="0"><span>anyone else's cargo.</span></div>
    <div id="cap-66" class="clip cap" data-start="77.59" data-duration="1.3" data-track-index="0"><span>The fee pushes everyone</span></div>
    <div id="cap-67" class="clip cap" data-start="78.89" data-duration="1.57" data-track-index="0"><span>to return it fast.</span></div>
    <div id="cap-68" class="clip cap" data-start="80.47" data-duration="0.42" data-track-index="0"><span>So how do</span></div>
    <div id="cap-69" class="clip cap" data-start="80.89" data-duration="0.91" data-track-index="0"><span>you avoid it?</span></div>
    <div id="cap-70" class="clip cap" data-start="81.8" data-duration="1.02" data-track-index="0"><span>Have your papers ready</span></div>
    <div id="cap-71" class="clip cap" data-start="82.82" data-duration="1.4" data-track-index="0"><span>before the ship arrives,</span></div>
    <div id="cap-72" class="clip cap" data-start="84.22" data-duration="0.93" data-track-index="0"><span>so customs,</span></div>
    <div id="cap-73" class="clip cap" data-start="85.15" data-duration="0.86" data-track-index="0"><span>the government's check</span></div>
    <div id="cap-74" class="clip cap" data-start="86.01" data-duration="0.83" data-track-index="0"><span>on imports,</span></div>
    <div id="cap-75" class="clip cap" data-start="86.84" data-duration="1.4" data-track-index="0"><span>clears it fast.</span></div>
    <div id="cap-76" class="clip cap" data-start="88.24" data-duration="1.11" data-track-index="0"><span>Ask for extra free</span></div>
    <div id="cap-77" class="clip cap" data-start="89.35" data-duration="1.44" data-track-index="0"><span>days when you book.</span></div>
    <div id="cap-78" class="clip cap" data-start="90.79" data-duration="0.81" data-track-index="0"><span>Return the empty</span></div>
    <div id="cap-79" class="clip cap" data-start="91.6" data-duration="1.41" data-track-index="0"><span>box on time.</span></div>
    <div id="cap-80" class="clip cap" data-start="93.01" data-duration="0.65" data-track-index="0"><span>Freight is what</span></div>
    <div id="cap-81" class="clip cap" data-start="93.66" data-duration="0.43" data-track-index="0"><span>you pay to</span></div>
    <div id="cap-82" class="clip cap" data-start="94.09" data-duration="1.21" data-track-index="0"><span>move the box.</span></div>
    <div id="cap-83" class="clip cap" data-start="95.3" data-duration="1.61" data-track-index="0"><span>Demurrage and detention are</span></div>
    <div id="cap-84" class="clip cap" data-start="96.91" data-duration="0.69" data-track-index="0"><span>what you pay when</span></div>
    <div id="cap-85" class="clip cap" data-start="97.6" data-duration="1.07" data-track-index="0"><span>it stops.</span></div>
    <div id="cap-86" class="clip cap" data-start="98.67" data-duration="0.54" data-track-index="0"><span>And the port's</span></div>
    <div id="cap-87" class="clip cap" data-start="99.21" data-duration="1.14" data-track-index="0"><span>own storage fee?</span></div>
    <div id="cap-88" class="clip cap" data-start="100.35" data-duration="1.44" data-track-index="0"><span>That's part two.</span></div>
    <div id="cap-89" class="clip cap" data-start="101.79" data-duration="0.81" data-track-index="0"><span>Until then,</span></div>
    <div id="cap-90" class="clip cap" data-start="102.6" data-duration="0.68" data-track-index="0"><span>watch the clock</span></div>
    <div id="cap-91" class="clip cap" data-start="103.28" data-duration="1.24" data-track-index="0"><span>on your container.</span></div>
    <div id="cap-92" class="clip cap" data-start="104.52" data-duration="2.67" data-track-index="0"><span>More at f16sefreight.com.</span></div>
