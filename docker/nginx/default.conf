# F16s Freight OS — three portals, one Laravel entrypoint (implementation_guide.md §0.2)
#
# All three hostnames forward to the SAME application. Laravel resolves the portal from
# the Host header on every request — see implementation_guide.md §3.3 (BindPortalScope).
# It is NOT bound at login and NOT held in a session; this app is stateless JWT.
#
#   focusair.*  -> active_portal_scope = 'air'
#   focussea.*  -> active_portal_scope = 'sea'
#   admin.*     -> platform superadmin, no tenant binding
#
# For local use, add to /etc/hosts:
#   127.0.0.1  focusair.f16s.local focussea.f16s.local admin.f16s.local
# then browse http://focusair.f16s.local:8080

server {
    listen 80 default_server;
    server_name focusair.f16sefreight.com focussea.f16sefreight.com admin.f16sefreight.com
                focusair.f16s.local       focussea.f16s.local       admin.f16s.local
                localhost;

    root /var/www/public;
    index index.php;

    charset utf-8;
    client_max_body_size 30M;

    # The portal is decided by this header downstream. Pass it through untouched.
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTP_HOST $host;
        include fastcgi_params;
        fastcgi_read_timeout 120;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }
    location ~ /\.(?!well-known).* { deny all; }

    error_log  /dev/stderr warn;
    access_log /dev/stdout;
}
