# F16s Freight OS — six portals, one Laravel entrypoint (implementation_guide.md §0.2)
#
# All six hostnames forward to the SAME application. Laravel resolves the scope from
# the Host header on every request — see implementation_guide.md §3.3 (BindPortalScope).
# It is NOT bound at login and NOT held in a session; this app is stateless JWT.
#
#   focusair.*   -> active_portal_scope = 'air'
#   focussea.*   -> active_portal_scope = 'sea'
#   focusroad.*  -> active_portal_scope = 'road'   (mode live, UI deferred — PRD §11)
#   accounts.*   -> no portal scope; still tenant-bound. One ledger spans all modes
#   admin.*      -> no portal scope; still tenant-bound. The CLIENT's Boss / Director
#   superadmin.* -> NO TENANT BINDING. F16s's own staff, across every tenant
#
# For local use, add to /etc/hosts:
#   127.0.0.1  focusair.f16s.local focussea.f16s.local focusroad.f16s.local \
#              accounts.f16s.local admin.f16s.local superadmin.f16s.local
# then browse http://focusair.f16s.local:8080

# Six hosts, two independent bindings (PRD.md §1.3):
#   focusair / focussea / focusroad  -> tenant-bound, portal-scoped to that mode
#   accounts / admin                 -> tenant-bound, NO portal scope (cross-mode)
#   superadmin                       -> NO tenant binding; F16s platform staff only
# admin. is the CLIENT tenant's Boss. superadmin. is F16s's own staff. Never merge them.
server {
    listen 80 default_server;
    server_name focusair.f16sefreight.com  focussea.f16sefreight.com  focusroad.f16sefreight.com
                accounts.f16sefreight.com  admin.f16sefreight.com     superadmin.f16sefreight.com
                focusair.f16s.local        focussea.f16s.local        focusroad.f16s.local
                accounts.f16s.local        admin.f16s.local           superadmin.f16s.local
                localhost;

    root /var/www/public;
    index index.php;

    charset utf-8;
    client_max_body_size 30M;

    # Compress text on the way out (2026-11-10 audit §5): app.js alone is 1.4 MB uncompressed, and every API answer
    # is JSON. Images and PDFs are already compressed and are left alone.
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml
               application/xml+rss image/svg+xml font/ttf font/otf;

    # A chunk's name carries a hash of its contents, so it can be kept for good: a new build is a new name.
    location ^~ /js/chunk/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
        try_files $uri =404;
    }

    # app.js, app.css and the like keep their names across builds: the browser may keep them but must ask first.
    location ~* \.(?:js|css)$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location ~* \.(?:png|jpe?g|gif|webp|svg|ico|woff2?|ttf|otf)$ {
        add_header Cache-Control "public, max-age=604800";
        access_log off;
        try_files $uri /index.php?$query_string;
    }

    # The portal is decided by this header downstream. Pass it through untouched.
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        # $http_host, not $host: $host drops the port, so every absolute URL Laravel builds
        # (signed PDF links, the staff reviews' "See the details") lost :8080 locally.
        fastcgi_param HTTP_HOST $http_host;
        include fastcgi_params;
        fastcgi_read_timeout 120;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }
    location ~ /\.(?!well-known).* { deny all; }

    error_log  /dev/stderr warn;
    access_log /dev/stdout;
}
